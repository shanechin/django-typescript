name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django: "5.0.14"
            drf: "3.15.2"
          - python-version: "3.11"
            django: "5.1.15"
            drf: "3.16.1"
          - python-version: "3.12"
            django: "5.2.19"
            drf: "3.17.2"
          - python-version: "3.13"
            django: "5.2.19"
            drf: "3.18.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Django==${{ matrix.django }}" "djangorestframework==${{ matrix.drf }}" "jinja2>=3.1" "pyparsing>=3.1"
          python -m pip install -e . --no-deps
      - name: Test
        run: python runtests.py

  typescript:
    name: TypeScript 5.9 generated client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Generate, typecheck, and run the client helpers
        run: |
          OUT="$(mktemp -d)"
          python tests/generate_client.py "$OUT"
          cd "$OUT"
          npm init -y >/dev/null
          npm install --silent typescript@5.9.3 lodash @types/lodash @types/node node-fetch@2 @types/node-fetch@2
          npx tsc -p tsconfig.json --pretty false
          node "$GITHUB_WORKSPACE/tests/check_generated_client.js" "$OUT/build"
